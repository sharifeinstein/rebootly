[package]
name = "rebootly-core"
description = "Engine for Rebootly: hive parser, Source trait, resolver, manifest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
fs4.workspace = true
serde_norway.workspace = true
age = "0.12"
tar = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# Windows attributes on NTFS mounts (already in the tree through tar).
xattr = "1"

[dev-dependencies]
tempfile.workspace = true
rebootly-core = { path = ".", features = ["fixtures"] }

[lints]
workspace = true

[features]
# Synthetic Windows volumes for tests and the fixture generator.
fixtures = []

[[example]]
name = "gen_fixtures"
required-features = ["fixtures"]
