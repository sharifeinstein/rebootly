[package]
name = "rebootly-gui"
description = "Rebootly's Windows GUI (egui): back up, restore, saved jobs"
version.workspace = true
edition.workspace = true
# eframe 0.37 needs 1.95; the rest of the workspace stays on 1.85.
rust-version = "1.95"
license.workspace = true
publish.workspace = true

[[bin]]
name = "Rebootly"
path = "src/main.rs"

[dependencies]
rebootly-core.workspace = true
rebootly-host.workspace = true
anyhow.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
qrcode = { version = "0.14", default-features = false }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.18", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["x11", "wayland"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
tempfile.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", default-features = false }

[build-dependencies]
embed-manifest = "1.5"

[lints]
workspace = true
