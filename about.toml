# Licences allowed in Rebootly's dependencies (all compatible with
# distributing Apache-2.0 binaries). `scripts/licenses.sh` fails if a
# dependency needs anything else.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
# The release is a Windows build.
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
private = { ignore = true }
