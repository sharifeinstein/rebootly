schema: 1
id: outlook
name: Microsoft Outlook (classic)
version: 1
detect:
  any:
    - path: "%APPDATA%\\Microsoft\\Signatures"
    - path: "%LOCALAPPDATA%\\Microsoft\\Outlook"
    - registry: "HKCU\\Software\\Microsoft\\Office\\16.0\\Outlook\\Profiles"
    - registry: "HKCU\\Software\\Microsoft\\Office\\15.0\\Outlook\\Profiles"
paths:
  # Signatures (.htm, .rtf, .txt and their _files folders). The .htm files
  # can name the old profile path, so they are rewritten on restore.
  - src: "%APPDATA%\\Microsoft\\Signatures"
    rewrite: true
  # Outlook 2007 and older upgrades keep PST files here; nothing else copies
  # AppData, so they move with the pack (sizes show in pre-flight; a PST in
  # use is read from a shadow copy). The .ost files beside them are caches
  # of server mail and are never copied (SPEC 3.6). PSTs in
  # Documents\Outlook Files come with Documents.
  - src: "%LOCALAPPDATA%\\Microsoft\\Outlook"
    include: ["*.pst"]
requires_closed: ["OUTLOOK.EXE"]
os: [win10, win11]
notes: >-
  Signatures move. Accounts don't: add each one again in Outlook (it asks
  for the password or a sign-in); mail on Microsoft 365, Exchange, Outlook.com
  or IMAP comes back from the server. Your own .pst data files (in Documents
  or copied by this pack) must be opened again: File > Open & Export > Open
  Outlook Data File. A .pst kept anywhere else (File > Account Settings >
  Data Files shows where) must be added as a custom folder. The new Outlook
  keeps signatures in the cloud. On a non-English Windows the Signatures
  folder may have a translated name; add it as a custom folder.
