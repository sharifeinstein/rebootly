schema: 1
id: chrome
name: Google Chrome
version: 3
detect:
  any:
    - path: "%LOCALAPPDATA%\\Google\\Chrome\\User Data"
    - uninstall_name: "Google Chrome*"
winget_id: Google.Chrome
paths:
  - src: "%LOCALAPPDATA%\\Google\\Chrome\\User Data"
    # Only what is worth moving, per profile (Default, Profile 1, ...).
    # Not: caches, LOCK/LOG files, metrics, components, open tabs, Local
    # State, Login Data and Cookies (SPEC 3.6; they can't be decrypted elsewhere).
    include:
      - "*/Bookmarks"
      - "*/Bookmarks.bak"
      - "*/Preferences"
      - "*/Secure Preferences"
      - "*/History"
      - "*/Favicons"
      - "*/Top Sites"
      - "*/Shortcuts"
      - "*/Web Data"
      - "*/Custom Dictionary.txt"
      - "*/Extensions/**"
      - "*/Local Extension Settings/**"
      - "*/Sync Extension Settings/**"
    # LevelDB lock and log files inside the extension folders.
    exclude:
      - "**/LOCK"
      - "**/LOG"
      - "**/LOG.old"
requires_closed: ["chrome.exe"]
os: [win10, win11]
notes: >-
  Bookmarks, extensions, settings and history move; open tabs don't, and on
  a new PC the browser may reset the start page and search engine. Saved
  passwords and cookies are never copied (they can't be decrypted on another
  PC): turn on Chrome sync, or export passwords to CSV before migrating.
