schema: 1
id: chrome
name: Google Chrome
version: 1
detect:
  any:
    - path: "%LOCALAPPDATA%\\Google\\Chrome\\User Data"
    - uninstall_name: "Google Chrome*"
winget_id: Google.Chrome
paths:
  # Caches, Login Data, Cookies and Local State are always excluded (SPEC 3.6).
  - src: "%LOCALAPPDATA%\\Google\\Chrome\\User Data"
    exclude:
      - "Crashpad"
      - "Safe Browsing"
      - "component_crx_cache"
      - "extensions_crx_cache"
      - "OptimizationGuidePredictionModels"
      - "WidevineCdm"
      - "SwReporter"
      - "**/Service Worker"
requires_closed: ["chrome.exe"]
os: [win10, win11]
notes: >-
  Bookmarks, extensions, settings and history move. Saved passwords and
  cookies are never copied (they can't be decrypted on another PC): turn on
  Chrome sync, or export passwords to CSV before migrating.
