schema: 1
id: windows-shell
name: Windows shell and personalization
version: 1
detect:
  any:
    - always: true
paths:
  - src: "%APPDATA%\\Microsoft\\Windows\\Start Menu"
  - src: "%APPDATA%\\Microsoft\\Internet Explorer\\Quick Launch\\User Pinned\\TaskBar"
  - src: "%APPDATA%\\Microsoft\\Windows\\Recent\\AutomaticDestinations"
    include: ["f01b4d95cf55d32a.automaticDestinations-ms"]   # Quick Access
  - src: "%APPDATA%\\Microsoft\\Windows\\Themes"
  - src: "%APPDATA%\\Microsoft\\Windows\\SendTo"
# Tier 3 HKCU allowlist (SPEC 4). Never the whole hive.
registry:
  - "HKCU\\Control Panel"
  - "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced"
  - "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Taskband"
  - "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\HideDesktopIcons"
  - "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Themes\\Personalize"
  - "HKCU\\Keyboard Layout"
  - "HKCU\\Network"
  - "HKCU\\Environment"
notes: "Environment variables and mapped drives are reviewed before they are applied on restore."
