schema: 1
id: brave
name: Brave
version: 1
detect:
  any:
    - path: "%LOCALAPPDATA%\\BraveSoftware\\Brave-Browser\\User Data"
    - uninstall_name: "Brave"
winget_id: Brave.Brave
paths:
  - src: "%LOCALAPPDATA%\\BraveSoftware\\Brave-Browser\\User Data"
    # Only what is worth moving, per profile (Default, Profile 1, ...).
    # Not: caches, LOCK/LOG files, metrics, components, open tabs, Local
    # State, Login Data and Cookies (SPEC 3.6; they can't be decrypted elsewhere).
    include:
      - "*/Bookmarks"
      - "*/Bookmarks.bak"
      - "*/Preferences"
      - "*/Secure Preferences"
      - "*/History"
      - "*/Favicons"
      - "*/Top Sites"
      - "*/Shortcuts"
      - "*/Web Data"
      - "*/Custom Dictionary.txt"
      - "*/Extensions/**"
      - "*/Local Extension Settings/**"
      - "*/Sync Extension Settings/**"
    # LevelDB lock and log files inside the extension folders.
    exclude:
      - "**/LOCK"
      - "**/LOG"
      - "**/LOG.old"
requires_closed: ["brave.exe"]
os: [win10, win11]
notes: >-
  Bookmarks, extensions, settings and history move; open tabs don't, and on
  a new PC the browser may reset the start page and search engine. Saved
  passwords and cookies are never copied (they can't be decrypted on another
  PC): turn on Brave Sync, or export passwords to CSV before migrating.
  Brave Wallet: keep its recovery phrase at hand; restore the wallet from it
  if it doesn't open on the new PC.
