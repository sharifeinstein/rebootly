schema: 1
id: dev-dotfiles
name: Git, SSH and developer config folders
version: 2
detect:
  any:
    - path: "%USERPROFILE%\\.gitconfig"
    - path: "%USERPROFILE%\\.ssh"
    - path: "%USERPROFILE%\\.config"
    - path: "%USERPROFILE%\\.aws"
    - path: "%USERPROFILE%\\.kube"
paths:
  - src: "%USERPROFILE%\\.gitconfig"
    rewrite: true
  - src: "%USERPROFILE%\\.gitignore_global"
  - src: "%USERPROFILE%\\.config"
    rewrite: true
  # Keys and credentials: encrypted sensitive bundle only (SPEC 6, 9).
  - src: "%USERPROFILE%\\.ssh"
    sensitive: true
  - src: "%USERPROFILE%\\.aws"
    sensitive: true
  # Only credentials and config, not the CLI's caches, logs and extensions.
  - src: "%USERPROFILE%\\.azure"
    exclude: ["cliextensions", "logs", "commands", "telemetry", "*.log"]
    sensitive: true
  - src: "%USERPROFILE%\\.kube"
    exclude: ["cache", "http-cache"]
    sensitive: true
  - src: "%USERPROFILE%\\.docker"
    include: ["config.json"]
    sensitive: true
  - src: "%USERPROFILE%\\.npmrc"
    sensitive: true
